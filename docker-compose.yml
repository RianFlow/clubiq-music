version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: music_voting_db
    restart: always
    environment:
      POSTGRES_DB: music_voting_dev
      POSTGRES_USER: clubiq_dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: