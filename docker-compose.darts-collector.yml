services:
  web:
    environment:
      DARTS_COLLECTOR_READ_ENABLED: ${DARTS_COLLECTOR_READ_ENABLED:-0}
      DARTS_3K_HTTPS_PROXY: ${DARTS_3K_HTTPS_PROXY:-http://darts-egress:40001}
    networks: [default, darts_egress]

  darts-egress:
    profiles: [darts-collector]
    image: clubiq-darts-egress:${DARTS_RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.darts-egress
    environment:
      DARTS_WARP_ACCEPT_TOS: "1"
    networks: [darts_egress]
    volumes:
      - darts_egress_state:/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    read_only: true
    restart: unless-stopped
    init: true
    mem_limit: 192m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"

  darts-collector:
    profiles: [darts-collector]
    image: clubiq-darts-collector:${DARTS_RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.darts-collector
    entrypoint: [python, darts_collector.py]
    command: [--status-file, /state/status.json]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME fehlt}
      DB_USER: ${DB_USER:?DB_USER fehlt}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      DARTS_COLLECTOR_READ_ENABLED: "0"
      DARTS_SNAPSHOT_WRITES_DISABLED: "1"
      DARTS_3K_HTTPS_PROXY: ${DARTS_3K_HTTPS_PROXY:-http://darts-egress:40001}
    networks: [default, darts_egress]
    volumes:
      - darts_collector_state:/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    read_only: true
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      darts-egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json,time;from pathlib import Path;p=Path('/state/status.json');assert p.is_file() and time.time()-p.stat().st_mtime<180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "3"
volumes:
  darts_collector_state:
  darts_egress_state:
networks:
  darts_egress:
