name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Containerimages über den Cache laden
        run: |
          # Pull the public cache explicitly, then preserve the references used
          # by the production Dockerfiles and Compose configuration.
          for image in library/debian:trixie-slim library/python:3.11-slim library/postgres:15-alpine docker/dockerfile:1; do
            docker pull "mirror.gcr.io/$image"
            docker tag "mirror.gcr.io/$image" "${image#library/}"
          done
          proxy_base='python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258'
          docker pull "mirror.gcr.io/library/$proxy_base"
          docker tag "mirror.gcr.io/library/$proxy_base" python:3.12-slim-bookworm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python-Syntax prüfen
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          PY
      - name: Browser-Code prüfen
        run: for file in static/*.js sw.js; do node --check "$file"; done
      - name: Archiv-Auswahl und Abstimmungsende prüfen
        run: |
          node tests/test_archive_ui.cjs
          node tests/test_qol_ui.cjs
          node tests/test_reliability.cjs
          node tests/test_song_info.cjs
          node tests/test_darts.cjs
          node tests/test_darts_home.cjs
          node tests/test_darts_broadcast.cjs
          node tests/test_darts_history.cjs
          node tests/test_darts_experience.cjs
          node tests/test_darts_usability.cjs
          node tests/test_darts_source_fallback.cjs
          node tests/test_darts_player_data.cjs
          node tests/test_darts_training_source.cjs
      - name: Getrennte Musikbereiche im Browser prüfen
        run: |
          npm install --prefix "$RUNNER_TEMP/music-browser-tests" --no-audit --no-fund --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/music-browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_navigation_browser.cjs
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_darts_home_browser.cjs
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_darts_tournament_browser.cjs
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_darts_training_browser.cjs
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_cms_browser.cjs
      - name: App mit Training und Push-Auswahl prüfen
        run: |
          npm ci --prefix mobile --no-audit --no-fund
          npm test --prefix mobile
          npm run build:web --prefix mobile
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node tests/test_darts_live_display_browser.cjs
          NODE_PATH="$RUNNER_TEMP/music-browser-tests/node_modules" node mobile/tests/web-browser.cjs
      - name: Player mit echtem mpv und stummer Ausgabe prüfen
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work debian:trixie-slim sh -c \
            'apt-get update -qq && apt-get install -y --no-install-recommends python3 mpv >/dev/null && python3 scripts/player-smoke-test.py'
      - name: Compose-Konfiguration prüfen
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.darts-collector.yml --profile darts-collector config --quiet
      - name: Darts-Proxy ohne Registrierung bauen
        run: |
          # Keep the production recipe and pinned digest. BuildKit must use the
          # cache explicitly even when this base was already pulled locally.
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('Dockerfile.darts-egress').read_text()
          base = 'python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258'
          assert source.startswith('FROM ' + base + '\n')
          target = Path(os.environ['RUNNER_TEMP']) / 'darts-egress.Dockerfile'
          target.write_text(source.replace('FROM ' + base, 'FROM mirror.gcr.io/library/' + base, 1))
          PY
          docker build -f "$RUNNER_TEMP/darts-egress.Dockerfile" -t clubiq-darts-egress:check .
      - name: Datenhelfer mit allen Quelldateien bauen
        run: |
          docker build -f Dockerfile.darts-collector -t clubiq-darts-collector:check .
          docker run --rm --entrypoint python clubiq-darts-collector:check -c "import darts_collector, darts_ranking, darts_training"
      - name: Web-Image bauen
        run: docker compose build web
      - name: Sicherheits- und UI-Verträge prüfen
        run: docker compose run --rm --no-deps web python -m unittest discover -s tests
      - name: Soundboard-Migration mit PostgreSQL prüfen
        run: |
          docker compose up -d --wait db
          docker compose run --rm --no-deps -e SOUNDBOARD_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_soundboard_postgres.py
          docker compose run --rm --no-deps -e ARCHIVE_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_archive_postgres.py
          docker compose run --rm --no-deps -e ARCHIVE_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_library_postgres.py
      - name: Dauerhaften Darts-Datenstand mit PostgreSQL prüfen
        run: docker compose run --rm --no-deps -e DARTS_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_darts_snapshots_postgres.py
      - name: Automatischen Darts-Datenhelfer mit PostgreSQL prüfen
        run: docker compose run --rm --no-deps -e DARTS_COLLECTOR_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_darts_collector_postgres.py
      - name: Vereins-CMS und getrennte Redakteurszugänge mit PostgreSQL prüfen
        run: docker compose run --rm --no-deps -e CMS_TEST_POSTGRES=1 web python -m unittest discover -s tests -p test_cms_postgres.py
